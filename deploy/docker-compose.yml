# Close Copilot's own services (CC-102). ERPNext runs from its own compose
# file built with frappe_docker (deploy/erpnext/, CC-102); `make up` starts both.
#
# Memory: Postgres ~0.3 GB, each TEI model ~0.5 GB, docling-serve ~2 GB.
# docling only starts with the `ingest` profile: `make up-ingest`.
name: close-copilot

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
      POSTGRES_DB: copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  tei-embed:
    # On Apple Silicon set TEI_IMAGE_TAG=cpu-arm64-1.9 in .env
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-cpu-1.9}
    command: ["--model-id", "BAAI/bge-small-en-v1.5"]
    ports:
      - "8081:80"
    volumes:
      - tei-models:/data

  tei-rerank:
    image: ghcr.io/huggingface/text-embeddings-inference:${TEI_IMAGE_TAG:-cpu-1.9}
    command: ["--model-id", "BAAI/bge-reranker-base"]
    ports:
      - "8082:80"
    volumes:
      - tei-models:/data

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    profiles: ["ingest"]
    ports:
      - "5001:5001"

volumes:
  pgdata:
  tei-models:
