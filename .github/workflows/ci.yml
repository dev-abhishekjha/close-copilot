name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, vet, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: unit tests
        run: go test -race -count=1 ./...
      - name: govulncheck
        run: go tool govulncheck ./...

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # testcontainers-go starts pgvector/pgvector:pg17 on the runner's Docker (CC-401).
      - name: integration tests
        run: go test -race -count=1 -tags=integration ./...
