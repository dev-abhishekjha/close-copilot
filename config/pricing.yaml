  # input). Not sure of the price, so it uses the Opus row and errs expensive.
  claude-opus-5-5:
    input_per_million: 15.00
    output_per_million: 75.00
    cache_write_per_million: 18.75
    cache_read_per_million: 1.50
  # claude-fable-5-1: not available on the probing account (api_error), so it
  # has no sourced price. It uses the Opus row and errs expensive.
  claude-fable-5-1:
    input_per_million: 15.00
    output_per_million: 75.00
