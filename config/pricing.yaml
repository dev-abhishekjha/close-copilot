# Token pricing table for Claude models (USD per million tokens).
# Loaded and validated by internal/llm.LoadPricing (CC-701).
#
# Lookup fails closed: a model with no row here is an error (llm.ErrUnpricedModel),
# never a zero cost. Matching is exact or case-insensitive; there is no family
# fallback. cache_write_per_million is the 5-minute ephemeral rate (1.25x input),
# which is what the Anthropic provider requests.
#
# The rows named haiku, sonnet and opus are matched only when a call reports
# that exact name (for example a CLI alias with no resolved model). They are not
# a fallback for other model IDs, and they carry the older, higher rates on
# purpose so they err expensive.
models:
  haiku:
    input_per_million: 1.00
    output_per_million: 5.00
    cache_write_per_million: 1.25
    cache_read_per_million: 0.10
  claude-3-5-haiku:
    input_per_million: 1.00
    output_per_million: 5.00
    cache_write_per_million: 1.25
    cache_read_per_million: 0.10
