  # Current models. Rows without a published, owner-confirmed list price use
  # the Opus row so spend is never undercounted against LLM_DAILY_BUDGET_USD.
  #
  # claude-haiku-4-5-20251001 (above) matches the published $1/$5 list price and
  # the cost Claude Code 2.1.295 reports.
  #
  # claude-haiku-5-5 and claude-sonnet-5-5: unconfirmed, owner to verify. Rates
  # derived from the modelUsage.costUSD that Claude Code 2.1.295 reports
  # (costBasis "list"), probed 2026-10-09 with two token mixes per model; both
  # mixes fit input x1, output x5, cache write x1.25 (5m) / x2 (1h), cache read
  # x0.1 exactly:
  #   claude-haiku-5-5:  input 0.10, output 0.50, cache write 0.125, cache read 0.01
  #   claude-sonnet-5-5: input 2.00, output 10.00, cache write 2.50, cache read 0.20
  # Until confirmed they are priced at the Opus row.
  claude-haiku-5-5:
    input_per_million: 15.00
    output_per_million: 75.00
    cache_write_per_million: 18.75
    cache_read_per_million: 1.50
