# Static task graph (CC-001). Generated from the Orchestrated Implementation Plan's
# task tables on 2026-10-07; titles from the Implementation Tickets doc.
# Status is not stored here: a ticket is done when main has a commit "CC-xxx: ...".
#
# owner: subagent in .claude/agents/, or human / orchestrator
# human_review: the owner reviews the diff before merge (G6); always true for regulated
# needs_erpnext: takes tmp/erpnext.lock; one holder at a time
# phase_2_pass: the ticket is widened from suite-skeleton to suite-v1 in Phase 2
# check: the gate-run acceptance a spec must turn into commands

tasks:

  # ---- Phase 0 ----
  - id: CC-001
    title: "Build harness: specs, task graph and merge gates"
    phase: 0
    owner: implementer
    risk: regulated
    human_review: true
    depends_on: [CC-101]
    needs_erpnext: false
    files:
      - "specs/_template.md"
      - "tasks/**"
      - "gates/*.go"
      - ".github/**"
    check: "go test ./gates/...; a PR touching an undeclared file fails G1"
  - id: CC-002
    title: "Custom static analyzers"
    phase: 0
    owner: implementer
    risk: regulated
    human_review: true
    depends_on: [CC-101]
    needs_erpnext: false
    files:
      - "gates/analyzers/**"
    check: "Analyzer tests flag each forbidden pattern in testdata"
  # CC-003 is not in the tickets doc. It comes from the remote being created after
  # CC-001; its approved spec is held in tmp/held-specs/CC-003.md.
  - id: CC-003
    title: "Module path and CODEOWNERS for the GitHub remote"
    phase: 0
    owner: implementer
    risk: standard
    human_review: true
    depends_on: [CC-001]
    needs_erpnext: false
    files:
      - "tasks/graph.yaml"
      - ".github/CODEOWNERS"
      - ".golangci.yml"
      - "Makefile"
      - "cmd/*/main.go"
      - "gates/cmd/*/main.go"
      - "gates/spec_test.go"
      - "internal/buildinfo/buildinfo.go"
      - "internal/cli/**"
    check: "go.mod and CODEOWNERS name dev-abhishekjha; make check green"
  # Hardening tickets CC-004, CC-005, CC-104 and CC-205 are not in the tickets
  # doc either. Their ticket text is in tasks/hardening.md.
  - id: CC-004
    title: "Harden the merge gates, CI and guard hook"
    phase: 0
    owner: implementer
    risk: regulated
    human_review: true
    depends_on: [CC-003]
    needs_erpnext: false
    files:
      - "gates/*.go"
      - "gates/cmd/**"
      - "gates/testdata/**"
      - ".github/**"
      - ".claude/hooks/guard-edit.sh"
    check: "A PR that weakens a gate is still judged by the base-ref gate; approval is pinned to a SHA"
  - id: CC-005
