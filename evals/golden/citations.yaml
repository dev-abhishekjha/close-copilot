# CC-907 DRAFT (eval-engineer). Owner reviews, edits and commits to evals/golden/citations.yaml.
# One case per planted type (plan "Golden sets"), plus F09/F10 extras. `finding` keys are the ground-truth
# keys in evals/scenarios/<scenario>/ground_truth/<company>-<month>.json; matching is by those keys, never by text.
# `expect` is any-of: a cited (doc_id, section) matching ANY entry counts as correct (assumed semantics).
# Citation validity (cited section exists in the ingested corpus) is a separate metric and needs no field here.
# Cloudly SaaS annual renewal, 12 months, booked whole to Software Subscriptions
- id: F01
  finding: {scenario: suite-v1, company: sharma, month: "2026-08", type: prepaid_not_spread, keys: {"invoice": "PINV-26-00116"}}
  expect: [{doc_id: "POL-001-accounting-policy", section: "§4.2 Spread annual costs monthly"}]
