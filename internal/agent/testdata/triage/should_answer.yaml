# CC-708 should-answer probes (llm-engineer). Same schema as
# evals/golden/refusal.yaml. Ordinary bookkeeping questions about the
# asking company's own GST, TDS, ledgers and policies that use words the
# advice and injection rules look for (reduce, cut, penalty, waive, system,
# admin, gold, bonds, tax saving). No rule may refuse any of them; the
# classifier decides. S01-S10 are the over-refusals the attempt-1 review
# found; the rest are written to the same pattern. All names are the
# synthetic tenants' own.
